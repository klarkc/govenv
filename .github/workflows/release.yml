name: "Release"

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release-please:
    outputs:
      candidate-revision: ${{ steps.candidate.outputs.sha }}
    environment: "authorized-effects"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.revision }}
        fetch-depth: "0"
        persist-credentials: "false"
    - name: "Install Nix"
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Check repository state"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Release Please"
      id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        config-file: ".github/release-please/config.json"
        manifest-file: ".github/release-please/manifest.json"
    - name: "Materialize release governance"
      if: ${{ steps.release.outputs.prs_created == 'true' }}
      run: "GOVENV_RELEASE_PR=\"$(jq -r '.number' <<< \"${GOVENV_RELEASE_PR_JSON}\")\"\nif [[ ! \"${GOVENV_RELEASE_PR}\" =~ ^[0-9]+$ ]]; then\n  echo \"Release Please did not return a valid pull request number.\" >&2\n  exit 2\nfi\nexport GOVENV_RELEASE_PR\nbash src/Govenv/Adapter/release-governance-pr.sh"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOVENV_RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
    - name: "Resolve release candidate revision"
      id: candidate
      if: ${{ steps.release.outputs.prs_created == 'true' }}
      run: "GOVENV_RELEASE_PR=\"$(jq -r '.number' <<< \"${GOVENV_RELEASE_PR_JSON}\")\"\nif [[ ! \"${GOVENV_RELEASE_PR}\" =~ ^[0-9]+$ ]]; then\n  echo \"Release Please did not return a valid pull request number.\" >&2\n  exit 2\nfi\ncandidate_revision=\"$(gh pr view \"${GOVENV_RELEASE_PR}\" --json headRefOid --jq '.headRefOid')\"\nif [[ ! \"${candidate_revision}\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo \"Release candidate head is not a full Git revision.\" >&2\n  exit 4\nfi\necho \"sha=${candidate_revision}\" >> \"${GITHUB_OUTPUT}\""
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOVENV_RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
    - name: "Materialize published release governance"
      if: ${{ steps.release.outputs.release_created == 'true' }}
      run: "bash src/Govenv/Adapter/release-governance-release.sh"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOVENV_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        GOVENV_RELEASE_SHA: ${{ steps.release.outputs.sha }}
  candidate-test:
    if: ${{ needs.release-please.outputs.candidate-revision != '' }}
    needs: release-please
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ needs.release-please.outputs.candidate-revision }}
