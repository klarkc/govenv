name: "Admin Materialize"

on:
  workflow_dispatch:

jobs:
  materialize:
    if: "${{ github.ref == 'refs/heads/main' }}"
    environment: "admin-materialization"
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: "false"
    - name: "Install Nix"
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Check repository state"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Build admin adapters"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:admin:build"
    - name: "Apply and verify setup"
      run: "nix run github:cachix/devenv/v2.3 -- shell -- .govenv/admin-apply-build/Setup"
      env:
        GH_TOKEN: ${{ secrets.GOVENV_ADMIN_TOKEN }}
    - name: "Record evidence"
      run: "{\n  printf '%s\\n' '### Admin materialization evidence'\n  printf '%s\\n' \"- Constitution: \\`${GITHUB_SHA}\\`\"\n  printf '%s\\n' \"- Target: \\`setup\\`\"\n  printf '%s\\n' \"- Repository: \\`${GITHUB_REPOSITORY}\\`\"\n  printf '%s\\n' \"- Workflow run: \\`${GITHUB_RUN_ID}\\`\"\n  printf '%s\\n' \"- Actor: \\`${GITHUB_ACTOR}\\`\"\n  printf '%s\\n' '- Expected: `Govenv.Materialization.Github.Administration.Setup.plan`'\n  printf '%s\\n' '- Observed: `all setup steps read-back equal`'\n  printf '%s\\n' \"- Assurance: \\`expected == observed\\`\"\n} >> \"${GITHUB_STEP_SUMMARY}\""
