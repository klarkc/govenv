name: Admin Materialize

on:
  workflow_dispatch:
    inputs:
      target:
        description: Governed admin materialization to apply
        required: true
        type: choice
        options:
          - github-description

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: admin-materialization
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
        with:
          extra-conf: |
            accept-flake-config = true
            substituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Materialize target
        run: |
          case "${{ inputs.target }}" in
            github-description)
              nix run github:cachix/devenv/v2.3 -- tasks run govenv:materialize:admin:github-description
              ;;
            *)
              echo "Unsupported admin materialization: ${{ inputs.target }}" >&2
              exit 64
              ;;
          esac

      - name: Apply target
        env:
          GH_TOKEN: ${{ secrets.GOVENV_ADMIN_TOKEN }}
        run: |
          case "${{ inputs.target }}" in
            github-description)
              expected="$(cat .govenv/admin/github-description)"
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}" \
                --field "description=${expected}" >/dev/null

              observed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""')"
              if [[ "${observed}" != "${expected}" ]]; then
                echo "Admin materialization verification failed." >&2
                echo "Expected: ${expected}" >&2
                echo "Observed: ${observed}" >&2
                exit 1
              fi

              {
                echo "### Admin materialization evidence"
                echo "- Constitution: \`${GITHUB_SHA}\`"
                echo "- Target: \`${{ inputs.target }}\`"
                echo "- Repository: \`${GITHUB_REPOSITORY}\`"
                echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
                echo "- Expected: \`${expected}\`"
                echo "- Observed: \`${observed}\`"
                echo "- Assurance: \`expected == observed\`"
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "Unsupported admin materialization: ${{ inputs.target }}" >&2
              exit 64
              ;;
          esac
