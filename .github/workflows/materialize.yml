name: "Materialize"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "materialize-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    outputs:
      effective-sha: ${{ steps.effective.outputs.sha }}
      release-boundary: ${{ steps.release-boundary.outputs.tag }}
    environment: "authorized-materialization"
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout authorized revision"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: "0"
        persist-credentials: "true"
        ssh-key: ${{ secrets.GOVENV_MATERIALIZER_SSH_KEY }}
    - name: "Install Nix"
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Materialize constitution"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:materialize"
    - name: "Check materialized state"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Detect materialization drift"
      id: drift
      run: "if [[ -z \"$(git status --porcelain)\" ]]; then\n  changed=false\nelse\n  changed=true\nfi\necho \"changed=${changed}\" >> \"${GITHUB_OUTPUT}\""
    - name: "Commit derived materializations"
      if: ${{ steps.drift.outputs.changed == 'true' }}
      run: "git config user.name \"govenv-materializer\"\ngit config user.email \"govenv-materializer@users.noreply.github.com\"\ngit add --all\nprintf '%s\\n' \\\n  'chore(materialize): update governed materializations' \\\n  '' \\\n  '' \\\n  \"Derived-From-Parent: true\" \\\n  'Refs: GV44 GV51 GV90 GV92 GV93' \\\n  'skip-checks: true' > .govenv/materialization-commit-message\ngit commit --cleanup=verbatim -F .govenv/materialization-commit-message\nrm .govenv/materialization-commit-message\ngit push origin HEAD:main"
    - name: "Record release boundary"
      id: release-boundary
      run: "release_boundary=\"$(git describe --tags --abbrev=0 2>/dev/null || true)\"\necho \"tag=${release_boundary}\" >> \"${GITHUB_OUTPUT}\""
    - name: "Record effective materialized revision"
      id: effective
      run: "echo \"sha=$(git rev-parse HEAD)\" >> \"${GITHUB_OUTPUT}\""
  test:
    if: ${{ github.event_name == 'push' }}
    needs: materialize
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
  release:
    if: ${{ github.event_name == 'push' }}
    needs: [materialize, test]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
  pages:
    if: ${{ github.event_name == 'push' }}
    needs: [materialize, test]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
  post-release-materialize:
    if: ${{ github.event_name == 'push' && always() && needs.materialize.result == 'success' }}
    needs: [materialize, release]
    outputs:
      effective-sha: ${{ steps.effective.outputs.sha }}
      changed: ${{ steps.drift.outputs.changed }}
    environment: "authorized-materialization"
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout authorized revision after Release"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ needs.materialize.outputs.effective-sha }}
        fetch-depth: "0"
        persist-credentials: "true"
        ssh-key: ${{ secrets.GOVENV_MATERIALIZER_SSH_KEY }}
    - name: "Detect published release boundary advancement"
      id: boundary
      run: "current_boundary=\"$(git describe --tags --abbrev=0 2>/dev/null || true)\"\nif [[ \"${current_boundary}\" == \"${GOVENV_PREVIOUS_RELEASE_BOUNDARY}\" ]]; then\n  advanced=false\nelse\n  advanced=true\nfi\necho \"advanced=${advanced}\" >> \"${GITHUB_OUTPUT}\""
      env:
        GOVENV_PREVIOUS_RELEASE_BOUNDARY: ${{ needs.materialize.outputs.release-boundary }}
    - name: "Install Nix"
      if: ${{ steps.boundary.outputs.advanced == 'true' }}
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      if: ${{ steps.boundary.outputs.advanced == 'true' }}
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Materialize post-release constitution"
      if: ${{ steps.boundary.outputs.advanced == 'true' }}
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:materialize"
    - name: "Check post-release materialized state"
      if: ${{ steps.boundary.outputs.advanced == 'true' }}
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Detect post-release materialization drift"
      id: drift
      if: ${{ steps.boundary.outputs.advanced == 'true' }}
      run: "if [[ -z \"$(git status --porcelain)\" ]]; then\n  changed=false\nelse\n  changed=true\nfi\necho \"changed=${changed}\" >> \"${GITHUB_OUTPUT}\""
    - name: "Commit post-release derived materializations"
      if: ${{ steps.boundary.outputs.advanced == 'true' && steps.drift.outputs.changed == 'true' }}
      run: "git config user.name \"govenv-materializer\"\ngit config user.email \"govenv-materializer@users.noreply.github.com\"\ngit add --all\nprintf '%s\\n' \\\n  'chore(materialize): update governed materializations' \\\n  '' \\\n  '' \\\n  \"Derived-From-Parent: true\" \\\n  'Refs: GV44 GV51 GV90 GV92 GV93' \\\n  'skip-checks: true' > .govenv/materialization-commit-message\ngit commit --cleanup=verbatim -F .govenv/materialization-commit-message\nrm .govenv/materialization-commit-message\ngit push origin HEAD:main"
    - name: "Record post-release effective revision"
      id: effective
      run: "echo \"sha=$(git rev-parse HEAD)\" >> \"${GITHUB_OUTPUT}\""
  release-reconcile:
    if: ${{ needs.post-release-materialize.outputs.changed == 'true' }}
    needs: post-release-materialize
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      revision: ${{ needs.post-release-materialize.outputs.effective-sha }}
