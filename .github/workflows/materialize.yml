name: "Materialize"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "materialize-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    outputs:
      effective-sha: ${{ steps.effective.outputs.sha }}
    environment: "authorized-materialization"
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: "0"
        persist-credentials: "false"
    - name: "Install Nix"
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Materialize constitution"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:materialize"
    - name: "Check materialized state"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Detect materialization drift"
      id: drift
      run: "if [[ -z \"$(git status --porcelain)\" ]]; then\n  changed=false\nelse\n  changed=true\nfi\necho \"changed=${changed}\" >> \"${GITHUB_OUTPUT}\""
    - name: "Verify materializer App capabilities"
      run: "observed=\"$(gh api \"/apps/${EXPECTED_APP_SLUG}\" --jq '.permissions | del(.metadata) | to_entries | sort_by(.key) | map([.key,.value] | join(\"=\")) | join(\",\")')\"\nif [[ \"${observed}\" != \"${EXPECTED_PERMISSIONS}\" ]]; then\n  echo \"GitHub App capability mismatch for ${EXPECTED_APP_SLUG}.\" >&2\n  echo \"Expected: ${EXPECTED_PERMISSIONS}\" >&2\n  echo \"Observed: ${observed}\" >&2\n  exit 1\nfi"
      env:
        EXPECTED_APP_SLUG: "govenv-materializer"
        EXPECTED_PERMISSIONS: "contents=write,workflows=write"
        GH_TOKEN: ${{ github.token }}
    - name: "Resolve materializer App"
      id: app-identity
      if: ${{ steps.drift.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
      run: "client_id=\"$(gh api \"/apps/${EXPECTED_APP_SLUG}\" --jq .client_id)\"\nif [[ -z \"${client_id}\" ]]; then\n  echo \"Unable to resolve client_id for ${EXPECTED_APP_SLUG}.\" >&2\n  exit 1\nfi\necho \"client-id=${client_id}\" >> \"${GITHUB_OUTPUT}\""
      env:
        EXPECTED_APP_SLUG: "govenv-materializer"
        GH_TOKEN: ${{ github.token }}
    - name: "Create materializer token"
      id: app-token
      if: ${{ steps.drift.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ steps.app-identity.outputs.client-id }}
        private-key: ${{ secrets.GOVENV_MATERIALIZER_PRIVATE_KEY }}
        repositories: ${{ github.repository }}
        permission-contents: "write"
        permission-workflows: "write"
    - name: "Verify materializer identity"
      if: ${{ steps.drift.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
      run: "if [[ \"${OBSERVED_APP_SLUG}\" != \"${EXPECTED_APP_SLUG}\" ]]; then\n  echo \"Materializer identity mismatch: expected ${EXPECTED_APP_SLUG}, observed ${OBSERVED_APP_SLUG}.\" >&2\n  exit 1\nfi"
      env:
        EXPECTED_APP_SLUG: "govenv-materializer"
        OBSERVED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
    - name: "Verify materializer token scope"
      if: ${{ steps.drift.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
      run: "observed=\"$(gh api /installation/repositories --paginate --jq '.repositories[].full_name' | sort -u | paste -sd, -)\"\nif [[ \"${observed}\" != \"${GITHUB_REPOSITORY}\" ]]; then\n  echo \"GitHub App token repository scope mismatch.\" >&2\n  echo \"Expected: ${GITHUB_REPOSITORY}\" >&2\n  echo \"Observed: ${observed}\" >&2\n  exit 1\nfi"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: "Resolve materializer identity"
      id: app-user
      if: ${{ steps.drift.outputs.changed == 'true' }}
      run: "echo \"user-id=$(gh api \"/users/${{ steps.app-token.outputs.app-slug }}[bot]\" --jq .id)\" >> \"${GITHUB_OUTPUT}\""
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: "Commit derived materializations"
      if: ${{ steps.drift.outputs.changed == 'true' }}
      run: "git config user.name \"${{ steps.app-token.outputs.app-slug }}[bot]\"\ngit config user.email \"${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com\"\ngit add --all\nprintf '%s\\n' \\\n  'chore(materialize): update governed materializations' \\\n  '' \\\n  '' \\\n  \"Derived-From-Authorized-Revision: ${GITHUB_SHA}\" \\\n  'Refs: GV44 GV51 GV90' \\\n  'skip-checks: true' > .govenv/materialization-commit-message\ngit commit --cleanup=verbatim -F .govenv/materialization-commit-message\nrm .govenv/materialization-commit-message\ngit push \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\" HEAD:main"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: "Record effective materialized revision"
      id: effective
      run: "echo \"sha=$(git rev-parse HEAD)\" >> \"${GITHUB_OUTPUT}\""
  test:
    if: ${{ github.event_name == 'push' }}
    needs: materialize
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
  release:
    if: ${{ github.event_name == 'push' }}
    needs: materialize
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
  pages:
    if: ${{ github.event_name == 'push' }}
    needs: materialize
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.materialize.outputs.effective-sha }}
