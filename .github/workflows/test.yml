name: "Test"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

concurrency:
  group: "test-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
    - name: "Checkout"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.revision != '' && inputs.revision || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: "0"
        persist-credentials: "false"
    - name: "Install Nix"
      uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      with:
        extra-conf: "accept-flake-config = true\nsubstituters = https://devenv.cachix.org https://cachix.cachix.org https://cache.nixos.org\nextra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM="
    - name: "Cache Nix"
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: "enabled"
        use-flakehub: "disabled"
    - name: "Materialize candidate transiently"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:materialize"
    - name: "Record candidate materialization preview"
      run: "{\n  printf '%s\\n' '### Candidate materialization preview'\n  printf '%s\\n' ''\n  if [[ -z \"$(git status --porcelain)\" ]]; then\n    printf '%s\\n' 'No tracked materialization drift.'\n  else\n    printf '%s\\n' 'Deterministic post-authorization materialization preview:'\n    printf '%s\\n' '' 'Tracked files:'\n    git status --short\n    printf '%s\\n' '' 'Diff stat:'\n    git diff --stat\n  fi\n} >> \"${GITHUB_STEP_SUMMARY}\""
    - name: "Check candidate learning gate"
      if: "${{ github.event_name == 'pull_request' }}"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:learning:candidate"
      env:
        GOVENV_CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    - name: "Check materialized candidate"
      run: "nix run github:cachix/devenv/v2.3 -- tasks run govenv:check"
    - name: "Run tests"
      run: "nix run github:cachix/devenv/v2.3 -- test"
